<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaction &amp; Ledger Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- ═══ LOADING SCREEN ════════════════════════════════════════════════════ -->
<div id="loading-screen" class="loading-screen">
  <div class="loading-screen-inner">
    <div style="width:52px;height:52px;border-radius:12px;background:#2d3a52;display:flex;align-items:center;justify-content:center">
      <svg viewBox="0 0 24 24" style="width:28px;height:28px;fill:#6aadff">
        <path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"/>
      </svg>
    </div>
    <div class="loading-screen-title">TMS</div>
    <div class="spinner" style="width:1.5rem;height:1.5rem;margin-top:0.75rem"></div>
  </div>
</div>

<!-- ═══ LOGIN SCREEN ═══════════════════════════════════════════════════════ -->
<div id="login-screen" class="login-wrap" style="display:none">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg viewBox="0 0 24 24">
          <path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"/>
        </svg>
      </div>
      <h1>TMS</h1>
      <p class="login-subtitle">Sign in to continue</p>
    </div>
    <form id="login-form" autocomplete="off">
      <div class="field-group">
        <label>Username</label>
        <input type="text" id="login-username" placeholder="Enter your username" required autofocus />
      </div>
      <div class="field-group">
        <label>Password</label>
        <div class="login-field-wrap">
          <input type="password" id="login-password" placeholder="Enter your password" required />
          <button type="button" class="login-pw-toggle" onclick="toggleLoginPw(this)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" class="pw-eye">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="login-error" class="alert alert-error" style="display:none"></div>
      <button type="submit" class="btn btn-blue btn-full" style="margin-top:0.5rem;padding:0.6rem">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M10 17v-3H3v-4h7V7l5 5-5 5zm9 2H12v-2h7V5h-7V3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2z"/>
        </svg>
        Sign In
      </button>
    </form>
  </div>
</div>

<!-- ═══ APP SHELL ═══════════════════════════════════════════════════════════ -->
<div id="app" style="display:none">

  <!-- Mobile top bar (visible only on small screens) -->
  <div id="mobile-topbar">
    <button id="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </button>
    <span class="mobile-topbar-title">TMS</span>
    <div style="width:38px"></div>
  </div>

  <!-- Overlay behind drawer on mobile -->
  <div id="sidebar-overlay" onclick="closeMobileMenu()"></div>

  <!-- Sidebar + main wrapper -->
  <div id="app-body">

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"/>
        </svg>
      </div>
      <span class="sidebar-brand-text">TMS</span>
    </div>

    <div class="sidebar-menu-label">Menu</div>
    <nav>
      <a href="#" class="nav-item active" data-page="dashboard">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        </span>
        <span>Dashboard</span>
      </a>
      <a href="#" class="nav-item" data-page="accounts">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        </span>
        <span>Accounts</span>
      </a>
      <a href="#" class="nav-item nav-operator" data-page="transactions">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
        </span>
        <span>Transactions</span>
      </a>
      <a href="#" class="nav-item" data-page="ledger">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM9 4h2v5l-1-.75L9 9V4zm9 16H6V4h1v9l3-2.25L13 13V4h5v16z"/></svg>
        </span>
        <span>Ledger</span>
      </a>
      <a href="#" class="nav-item" data-page="trial-balance">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>
        </span>
        <span>Trial Balance</span>
      </a>
      <a href="#" class="nav-item nav-admin" data-page="audit" style="display:none">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>
        </span>
        <span>Audit Log</span>
      </a>
      <a href="#" class="nav-item nav-admin" data-page="users" style="display:none">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        </span>
        <span>Users</span>
      </a>
    </nav>

    <!-- User profile -->
    <div class="sidebar-user">
      <div class="sidebar-user-row">
        <div class="sidebar-avatar" id="sidebar-avatar">A</div>
        <div>
          <div class="sidebar-user-name" id="sidebar-name">–</div>
          <div class="sidebar-user-role" id="sidebar-role">–</div>
        </div>
      </div>
      <div class="sidebar-user-actions">
        <button class="sidebar-user-action" onclick="openChangeMyPassword()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          <span>Change password</span>
        </button>
        <button class="sidebar-user-action danger" id="logout-btn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
          <span>Sign out</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <main id="main-content">
    <div id="page-dashboard" class="page active"></div>
    <div id="page-accounts" class="page"></div>
    <div id="page-transactions" class="page"></div>
    <div id="page-ledger" class="page"></div>
    <div id="page-trial-balance" class="page"></div>
    <div id="page-audit" class="page"></div>
    <div id="page-users" class="page"></div>
  </main>

  </div><!-- /#app-body -->

</div>

<!-- ═══ MODAL ══════════════════════════════════════════════════════════════ -->
<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal-box" id="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">Modal</h3>
      <button class="modal-close" id="modal-close-btn">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast-container"></div>

<script src="/js/api.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/pages/dashboard.js"></script>
<script src="/js/pages/accounts.js"></script>
<script src="/js/pages/transactions.js"></script>
<script src="/js/pages/ledger.js"></script>
<script src="/js/pages/trial-balance.js"></script>
<script src="/js/pages/audit.js"></script>
<script src="/js/pages/users.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
