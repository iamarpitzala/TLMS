<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaction &amp; Ledger Management System</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- ═══ LOADING SCREEN ════════════════════════════════════════════════════ -->
<div id="loading-screen" class="loading-screen">
  <div class="loading-screen-inner">
    <span class="logo-icon" style="font-size:2.5rem">📒</span>
    <div class="loading-screen-title">TLMS</div>
    <div class="spinner" style="width:2rem;height:2rem;margin-top:1rem"></div>
  </div>
</div>

<!-- ═══ LOGIN SCREEN ═══════════════════════════════════════════════════════ -->
<div id="login-screen" class="login-wrap" style="display:none">
  <div class="login-box">
    <div class="login-logo">
      <span class="logo-icon">📒</span>
      <h1>TLMS</h1>
      <p>Transaction &amp; Ledger Management System</p>
    </div>
    <form id="login-form" autocomplete="off">
      <div class="field-group">
        <label>Username</label>
        <input type="text" id="login-username" placeholder="Enter username" required autofocus />
      </div>
      <div class="field-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Enter password" required />
      </div>
      <div id="login-error" class="alert alert-error" style="display:none"></div>
      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
    </form>
  </div>
</div>

<!-- ═══ APP SHELL ═══════════════════════════════════════════════════════════ -->
<div id="app" style="display:none">

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-brand">
      <span class="logo-icon">📒</span>
      <span>TLMS</span>
    </div>
    <nav>
      <a href="#" class="nav-item active" data-page="dashboard">
        <span class="nav-icon">🏠</span> Dashboard
      </a>
      <a href="#" class="nav-item" data-page="accounts">
        <span class="nav-icon">👥</span> Accounts
      </a>
      <a href="#" class="nav-item nav-operator" data-page="transactions">
        <span class="nav-icon">💸</span> Transactions
      </a>
      <a href="#" class="nav-item" data-page="trial-balance">
        <span class="nav-icon">⚖️</span> Trial Balance
      </a>
      <a href="#" class="nav-item" data-page="ledger">
        <span class="nav-icon">📖</span> Ledger
      </a>
      <a href="#" class="nav-item nav-admin" data-page="audit" style="display:none">
        <span class="nav-icon">🔍</span> Audit Log
      </a>
      <a href="#" class="nav-item nav-admin" data-page="users" style="display:none">
        <span class="nav-icon">🔐</span> Users
      </a>
    </nav>
    <div class="sidebar-user">
      <div id="user-info"></div>
      <button id="logout-btn" class="btn btn-outline btn-sm">Logout</button>
    </div>
  </aside>

  <!-- Main content -->
  <main id="main-content">
    <div id="page-dashboard" class="page active"></div>
    <div id="page-accounts" class="page"></div>
    <div id="page-transactions" class="page"></div>
    <div id="page-ledger" class="page"></div>
    <div id="page-trial-balance" class="page"></div>
    <div id="page-audit" class="page"></div>
    <div id="page-users" class="page"></div>
  </main>

</div>

<!-- ═══ MODAL ══════════════════════════════════════════════════════════════ -->
<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal-box" id="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">Modal</h3>
      <button class="modal-close" id="modal-close-btn">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast-container"></div>

<script src="/js/api.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/pages/dashboard.js"></script>
<script src="/js/pages/accounts.js"></script>
<script src="/js/pages/transactions.js"></script>
<script src="/js/pages/ledger.js"></script>
<script src="/js/pages/trial-balance.js"></script>
<script src="/js/pages/audit.js"></script>
<script src="/js/pages/users.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
